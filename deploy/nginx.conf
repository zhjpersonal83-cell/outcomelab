limit_req_zone $binary_remote_addr zone=outcomelab_requests:1m rate=60r/m;
limit_req_zone $binary_remote_addr zone=outcomelab_sessions:1m rate=5r/m;
server {
 listen 80;
 server_name outcomelab.zhongjiehuang.com;
 access_log off;
 location ^~ /.well-known/acme-challenge/ { root /var/www/outcomelab-acme; }
 location / { return 301 https://outcomelab.zhongjiehuang.com$request_uri; }
}
server {
 listen 443 ssl;
 server_name outcomelab.zhongjiehuang.com;
 ssl_certificate /etc/letsencrypt/live/outcomelab.zhongjiehuang.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/outcomelab.zhongjiehuang.com/privkey.pem;
 include /etc/letsencrypt/options-ssl-nginx.conf;
 ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
 root /opt/outcomelab/current/frontend/dist;
 client_max_body_size 8k;
 client_body_timeout 10s;
 access_log off;
 error_log /var/log/nginx/outcomelab-error.log crit;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
 location = /api/sessions {
  limit_req zone=outcomelab_sessions burst=5 nodelay;
  limit_req_status 429;
  proxy_pass http://127.0.0.1:8011;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For "";
 }
 location /api/ {
  limit_req zone=outcomelab_requests burst=20 nodelay;
  limit_req_status 429;
  proxy_pass http://127.0.0.1:8011;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For "";
  proxy_connect_timeout 3s;
  proxy_read_timeout 15s;
 }
 location = /openapi.json { proxy_pass http://127.0.0.1:8011; }
 location / { try_files $uri $uri/ /index.html; }
}
