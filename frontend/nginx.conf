limit_req_zone $binary_remote_addr zone=visitors:10m rate=60r/m;
server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 client_max_body_size 8k;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
 access_log off;
 location /api/ {
  limit_req zone=visitors burst=20 nodelay;
  proxy_pass http://api:8000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For "";
 }
 location /openapi.json { proxy_pass http://api:8000; }
 location / { try_files $uri $uri/ /index.html; }
}
